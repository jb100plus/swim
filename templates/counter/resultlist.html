{% if result %}
    <table>
        <thead>
            <th>Platz</th><th>Name</th><th>Startklasse</th><th>Status</th><th>Logs (Schwimmen)</th>
        </thead>
        <tbody>
            {% for r in result %}
                <tr>
                    <td align="right" class="spaceRight">{{ forloop.counter }}</td>
                    <td class="spaceRight">
                        <a href="{% url 'logdetailview' starter_id=r.starter__id %}"> {{ r.starter }} {{ r.starter__lastname }} {{ r.starter__firstname }} </a></td>
                    <td class="spaceRight">{{ r.starter__startingclass}}</td>
                    <td align="right" class="spaceRight">{{ r.starter__state }}</td>
                    <td align="right">{{ r.count }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}
