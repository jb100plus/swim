{% extends "counter/layout.html" %}
{% block title %}
Results
{% endblock %}
{% block content %}
<h1 class="counterh1">results</h1>
<div id="result"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    reloadResult = function()
        {
        $.ajax({
        url: '{% url 'resultlist' %}',
        // get data from 'startlist'
        success: function(data) {
            if ($.trim(data)){
                $('#result').html(data);
                }
            }
    })};

    $(document).ready(reloadResult)
    
    const startSocket = new WebSocket(
        'ws://'
        + window.location.host
        + '/counter/'
    );

    startSocket.onmessage = function(e) {
        reloadResult();
        const data = JSON.parse(e.data);
        //console.log(data)
        //window.location.reload()
    };

    startSocket.onclose = function(e) {
        console.error('Count socket closed unexpectedly');
    };
    

</script>

{% endblock %}
